<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | ULTRA Lab</title>
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

  <header id="site-header"></header>

  <section class="page-hero"></section>

  <section class="section">
    <h2 class="section-title" id="contact-title"></h2>
    <div class="contact-layout">
      <div class="contact-info">
        <div class="contact-block">
          <p class="contact-label" id="contact-email-label"></p>
          <p class="contact-value" id="contact-email-value"></p>
        </div>
        <div class="contact-block">
          <p class="contact-label" id="contact-address-label"></p>
          <p class="contact-value" id="contact-address-value"></p>
        </div>
        <div class="contact-block">
          <p class="contact-label" id="contact-phone-label"></p>
          <div id="contact-phone-list"></div>
        </div>
      </div>
      <div class="contact-map">
        <iframe id="contact-map-iframe" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data/contact.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pages/contact.js"></script>
</body>
</html>
